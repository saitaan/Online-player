name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto-Detect and Prepare Project Structure
        run: |
          echo "=== 1. Checking Current Repository Content ==="
          ls -la

          # Agar zip file uploaded hai toh use extract karein
          for zip in *.zip; do
            if [ -f "$zip" ]; then
              echo "Found zip file: $zip. Extracting..."
              unzip -o "$zip"
            fi
          done

          # Agar settings.gradle.kts root par nahi hai, toh use dhundh kar root par layein
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            SETTINGS_PATH=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -n "$SETTINGS_PATH" ]; then
              SRC_DIR=$(dirname "$SETTINGS_PATH")
              echo "Found Gradle project in: $SRC_DIR. Moving files to root..."
              cp -r "$SRC_DIR"/* . 2>/dev/null || true
              cp -r "$SRC_DIR"/.* . 2>/dev/null || true
            fi
          fi

          echo "=== 2. Directory Structure After Move ==="
          ls -la
          chmod +x gradlew || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanPlayer-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
          
