name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Move files to root if inside subfolder
        run: |
          if [ -d "multimedia-player" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "Subfolder detected, moving files to root"
            mv multimedia-player/* multimedia-player/.* . 2>/dev/null || true
          fi
          chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanPlayer-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
          
