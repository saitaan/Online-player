name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Auto-Detect and Prepare Project Structure
        run: |
          echo "=== 1. Checking Repository Content ==="
          ls -la

          # Extract any zip if present
          for zip in *.zip; do
            if [ -f "$zip" ]; then
              echo "Extracting $zip..."
              unzip -o "$zip"
            fi
          done

          # Relocate to root if files are inside a subfolder
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            SETTINGS_PATH=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -n "$SETTINGS_PATH" ]; then
              SRC_DIR=$(dirname "$SETTINGS_PATH")
              echo "Relocating from $SRC_DIR to root..."
              cp -r "$SRC_DIR"/* . 2>/dev/null || true
              cp -r "$SRC_DIR"/.* . 2>/dev/null || true
            fi
          fi

          echo "=== 2. Setting Up Gradle 8.4 Wrapper ==="
          curl -sL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle-8.4-bin.zip
          unzip -q -o gradle-8.4-bin.zip
          ./gradle-8.4/bin/gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanPlayer-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
          
